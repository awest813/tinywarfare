name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs the tests in the Pages workflow

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - run: npm run build:pages -- --offline
